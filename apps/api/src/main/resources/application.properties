server.port=${SERVER_PORT:8081}
storage.root=${STORAGE_ROOT:storage}
admin.username=${ADMIN_USERNAME:}
admin.password-hash=${ADMIN_PASSWORD_HASH:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=20000000B
spring.servlet.multipart.max-request-size=20002000B
server.error.include-message=never
server.error.include-stacktrace=never
