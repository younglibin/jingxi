name: jingxi
services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      COOKIE_SECURE: "false"
      STORAGE_ROOT: /app/storage
      SERVER_PORT: "8081"
      JAVA_TOOL_OPTIONS: -Xmx1536m
    volumes:
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/api/health]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:8081
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 45s
      retries: 5
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PORT:-18080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/api/health]
      interval: 20s
      timeout: 5s
      retries: 3
